# Deploy to a Hugging Face Space (Docker SDK) on every push to `deploy`.
# Needs: repo secret HF_TOKEN. Optional: repo variable HF_SPACE (default "vyayam"). See DEPLOY_HF.md.
# The Space is created and configured by scripts/hf_bootstrap.py; the live URL is written back
# to DEPLOY_RESULT.md on the `deploy` branch.
# Security: values reach the shell only through env vars; the token is never echoed.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can pick any branch; only `deploy` may deploy.
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to commit DEPLOY_RESULT.md back to `deploy`
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create and configure the Space
        id: bootstrap
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          rm -f DEPLOY_RESULT.md # a committed result from an earlier run must not pass as this run's
          : "${HF_TOKEN:?repo secret HF_TOKEN is empty}"
          echo "::add-mask::${HF_TOKEN}"
          pip install --quiet huggingface_hub
          # Keep the result file out of the workspace: the snapshot step runs `git add -A`.
          rc=0
          python scripts/hf_bootstrap.py | tee "${RUNNER_TEMP}/bootstrap.out" || rc=$?
          [ -f DEPLOY_RESULT.md ] && mv DEPLOY_RESULT.md "${RUNNER_TEMP}/bootstrap_result.md"
          [ "$rc" -eq 0 ] || exit "$rc"
          {
            echo "live_url=$(grep '^LIVE_URL=' "${RUNNER_TEMP}/bootstrap.out" | tail -n 1 | cut -d= -f2-)"
            echo "hf_user=$(grep '^HF_USER=' "${RUNNER_TEMP}/bootstrap.out" | tail -n 1 | cut -d= -f2-)"
            echo "hf_space=$(grep '^HF_SPACE_NAME=' "${RUNNER_TEMP}/bootstrap.out" | tail -n 1 | cut -d= -f2-)"
          } >> "$GITHUB_OUTPUT"

      # HF rejects plain-git pushes that contain binary files (mp4, png, ...).
      # So push a single snapshot commit with binaries stored via Git LFS.
      # shortcut: Space history is one commit per deploy, GitHub keeps the real history.
      - name: Push snapshot to the Space
        env:
          HF_USER: ${{ steps.bootstrap.outputs.hf_user }}
          HF_SPACE_NAME: ${{ steps.bootstrap.outputs.hf_space }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          : "${HF_USER:?bootstrap did not report HF_USER}"
          : "${HF_SPACE_NAME:?bootstrap did not report HF_SPACE_NAME}"
          echo "::add-mask::${HF_TOKEN}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local

          git checkout --orphan hf-snapshot
          for ext in mp4 webm mp3 wav png jpg jpeg gif webp ico pdf woff woff2 ttf; do
            git lfs track "*.${ext}" > /dev/null
          done
          git rm -r --cached -q .
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"

          git push --force \
            "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${HF_SPACE_NAME}" \
            hf-snapshot:main

      # Runs on failure too: DEPLOY_RESULT.md on `deploy` is how a failure is read without Actions logs.
      - name: Write DEPLOY_RESULT.md back to deploy
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          saved="${RUNNER_TEMP}/bootstrap_result.md"
          out="${RUNNER_TEMP}/final_result.md"

          if [ "$JOB_STATUS" = "success" ] && [ -f "$saved" ] && [ "$(head -n 1 "$saved")" = "STATUS=OK" ]; then
            cp "$saved" "$out"
          elif [ -f "$saved" ] && [ "$(head -n 1 "$saved")" = "STATUS=FAILED" ]; then
            cp "$saved" "$out"
          elif [ -f "$saved" ]; then
            # Bootstrap passed but a later step failed.
            printf '%s\n' "STATUS=FAILED" "CODE=STEP_FAILED_AFTER_BOOTSTRAP" \
              "REASON=The Space was created but a later step failed (likely the push to the Space)." \
              "FIX=Open the run page and read the failed step; check HF_TOKEN can write to the Space." > "$out"
          else
            printf '%s\n' "STATUS=FAILED" "CODE=BOOTSTRAP_NO_RESULT" \
              "REASON=The bootstrap step stopped before it wrote a result (secret missing or pip failed)." \
              "FIX=Check the HF_TOKEN repo secret is set, then re-run." > "$out"
          fi
          {
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- At (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$out"

          cat "$out" >> "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -f -B deploy "${GITHUB_SHA}"
          cp "$out" DEPLOY_RESULT.md
          git add DEPLOY_RESULT.md
          git commit -q -m "chore(deploy): record deploy result [skip ci]"
          git pull --rebase origin deploy
          git push origin HEAD:deploy

          # Keep the Actions page honest.
          [ "$(head -n 1 "$out")" = "STATUS=OK" ] || exit 1
